<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Admin · Sổ tay Nghị quyết 57</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3fb; --panel:#ffffff; --ink:#132038; --mut:#5b6b86; --line:#e2e9f4;
  --gold:#d4a017; --gold2:#f6c945; --red:#c62828; --blue:#1552b8; --blue2:#2f7be6;
  --green:#188a4e; --shadow:0 14px 34px rgba(23,52,110,.14);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Be Vietnam Pro',system-ui,Arial,sans-serif;color:var(--ink);
  background:
   radial-gradient(1100px 520px at 88% -8%,rgba(47,123,230,.14),transparent 60%),
   radial-gradient(900px 480px at -6% 8%,rgba(212,160,23,.14),transparent 60%),
   var(--bg);
  min-height:100vh;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}

/* ===== Header ===== */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(120deg,#0f2c63,#1552b8 55%,#2f7be6);
  color:#fff;border-radius:20px;padding:16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 48%,transparent 66%);
  transform:translateX(-120%);animation:sheen 5.5s ease-in-out infinite}
@keyframes sheen{0%,72%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.top .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--gold2),var(--gold));
  display:grid;place-items:center;font-weight:800;color:#3a2a00;font-size:20px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:12.5px;opacity:.9}
.top .sp{flex:1}
.btn{border:0;cursor:pointer;font-family:inherit;font-weight:700;border-radius:12px;padding:10px 16px;font-size:14px;
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s,filter .16s;display:inline-flex;align-items:center;gap:8px}
.btn:active{transform:translateY(2px) scale(.99)}
.btn-gold{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#3a2a00;box-shadow:0 8px 18px rgba(212,160,23,.4)}
.btn-gold:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:rgba(255,255,255,.26)}
.btn-blue{background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff;box-shadow:0 8px 18px rgba(21,82,184,.35)}
.btn-blue:hover{transform:translateY(-2px)}
.btn-red{background:#fff;color:var(--red);border:1.5px solid #f3c9c9}
.btn-red:hover{background:#fdecec}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px}

/* ===== Login ===== */
.login{max-width:420px;margin:8vh auto 0;background:var(--panel);border-radius:22px;box-shadow:var(--shadow);
  padding:30px 26px;border:1px solid var(--line);text-align:center}
.login .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(145deg,var(--gold2),var(--gold));
  display:grid;place-items:center;font-weight:800;color:#3a2a00;font-size:28px;box-shadow:0 8px 20px rgba(212,160,23,.4)}
.login h2{margin:0 0 4px;font-size:20px}
.login .sub{color:var(--mut);font-size:13px;margin:0 0 20px}
.fld{text-align:left;margin-bottom:13px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:5px}
.fld input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:15px;background:#f8fafd}
.fld input:focus{outline:0;border-color:var(--blue2);background:#fff;box-shadow:0 0 0 4px rgba(47,123,230,.12)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--green)}

/* ===== Sections ===== */
.sec{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);
  padding:18px 18px 20px;margin-top:18px}
.sec-h{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.sec-h .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;color:#fff;flex:none}
.sec-h h3{margin:0;font-size:16.5px;font-weight:800}
.sec-h .cnt{margin-left:auto;font-size:12px;color:var(--mut);background:#eef3fb;padding:4px 10px;border-radius:20px;font-weight:700}
.sec-desc{color:var(--mut);font-size:12.8px;margin:0 0 14px}
.i-hero{background:linear-gradient(145deg,#2f7be6,#1552b8)}
.i-poster{background:linear-gradient(145deg,#e0574f,#c62828)}
.i-vt{background:linear-gradient(145deg,#f6c945,#d4a017);color:#3a2a00!important}
.i-gal{background:linear-gradient(145deg,#26a269,#188a4e)}

.slot{display:flex;gap:15px;align-items:center;flex-wrap:wrap;background:#f8fafd;border:1px solid var(--line);border-radius:15px;padding:13px}
.slot .thumb{width:150px;height:100px;border-radius:11px;object-fit:cover;background:#dde6f3;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.slot .body{flex:1;min-width:220px}
.slot .body input.t{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:13.5px;background:#fff}
.slot .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}

/* gallery grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:6px}
.card{background:#f8fafd;border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(23,52,110,.16)}
.card .imgwrap{position:relative;aspect-ratio:16/10;background:#dde6f3;overflow:hidden}
.card .imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
.card .imgwrap::after{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  transform:translateX(-120%);transition:transform .8s}
.card:hover .imgwrap::after{transform:translateX(120%)}
.card .ord{position:absolute;top:8px;left:8px;background:rgba(15,44,99,.9);color:#fff;font-size:11.5px;font-weight:700;
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.card .off{position:absolute;top:8px;right:8px;background:rgba(198,40,40,.92);color:#fff;font-size:10.5px;font-weight:700;
  padding:3px 8px;border-radius:20px;display:none}
.card.hidden .off{display:block}
.card.hidden .imgwrap img{filter:grayscale(.7) opacity(.55)}
.card .pad{padding:10px 11px 12px}
.card .pad textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:12.5px;
  padding:7px 9px;resize:vertical;min-height:46px;background:#fff;line-height:1.35}
.card .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.card .row .btn-sm{flex:1;justify-content:center;min-width:0}
.mini{background:#fff;border:1.3px solid var(--line);color:var(--ink)}
.mini:hover{border-color:var(--blue2);color:var(--blue)}

.addcard{border:2px dashed #b9c8e2;background:#f2f6fd;border-radius:15px;display:grid;place-items:center;min-height:180px;cursor:pointer;
  color:var(--blue);font-weight:700;font-size:14px;transition:.18s;text-align:center;padding:14px}
.addcard:hover{background:#e8f0fc;border-color:var(--blue2);transform:translateY(-3px)}
.addcard .plus{font-size:34px;line-height:1;margin-bottom:6px}

/* toast + overlay */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;
  background:#0f2c63;color:#fff;padding:12px 20px;border-radius:13px;font-size:14px;font-weight:600;box-shadow:var(--shadow);
  transition:.3s;z-index:90;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.err{background:var(--red)} .toast.ok{background:var(--green)}
.busy{position:fixed;inset:0;background:rgba(238,243,251,.72);backdrop-filter:blur(3px);display:none;place-items:center;z-index:80}
.busy.show{display:grid}
.spin{width:52px;height:52px;border-radius:50%;border:5px solid #cdd9ee;border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cfgwarn{background:#fff6e6;border:1.5px solid #f0d089;color:#7a5b00;border-radius:14px;padding:14px 16px;font-size:13.5px;margin-top:16px}
.cfgwarn code{background:#fff;padding:1px 6px;border-radius:6px;border:1px solid #eadfbc}
@media(max-width:520px){.slot .thumb{width:100%;height:150px}}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="loginView">
    <div class="login">
      <div class="logo">57</div>
      <h2>Super Admin</h2>
      <p class="sub">Quản trị ảnh · Sổ tay Nghị quyết 57</p>
      <div id="cfgBox"></div>
      <form id="loginForm">
        <div class="fld"><label>Email quản trị</label><input type="email" id="email" autocomplete="username" required></div>
        <div class="fld"><label>Mật khẩu</label><input type="password" id="pass" autocomplete="current-password" required></div>
        <button class="btn btn-blue" style="width:100%;justify-content:center" type="submit">Đăng nhập</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="appView" style="display:none">
    <div class="top">
      <div class="logo">57</div>
      <div>
        <h1>Bảng điều khiển ảnh — Sổ tay NQ57</h1>
        <p id="whoami">Đồng bộ realtime với Sổ tay · mọi thay đổi hiện ngay</p>
      </div>
      <div class="sp"></div>
      <a class="btn btn-gold" id="openSotay" href="index.html" target="_blank">Mở Sổ tay ↗</a>
      <a class="btn btn-blue" href="admin-org.html">Quản lý Tổ chức ↗</a>
      <button class="btn btn-ghost" id="logout">Đăng xuất</button>
    </div>

    <div id="sections"></div>
  </div>

</div>

<div class="busy" id="busy"><div class="spin"></div></div>
<div class="toast" id="toast"></div>

<!-- input file ẩn dùng chung -->
<input type="file" id="filePick" accept="image/*" style="display:none">

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ============ THIẾT LẬP ============ */
const SLOTS = {
  hero:      {name:"Ảnh Hero (đầu trang)",       ic:"i-hero", emoji:"🏙️", desc:"Ảnh lớn trên cùng trang chủ Sổ tay.", single:true},
  poster:    {name:"Poster Đề án Trung tâm",     ic:"i-poster", emoji:"📜", desc:"Ảnh poster Đề án ở khối kết.", single:true},
  vientruong:{name:"Ảnh Viện trưởng",            ic:"i-vt", emoji:"👤", desc:"Ảnh Viện trưởng — ngay dưới Poster Đề án.", single:true},
  gallery:   {name:"Thư viện “Tìm hiểu NQ57”",   ic:"i-gal", emoji:"🖼️", desc:"Bộ ảnh tuyên truyền ở tab 3 — thêm/bớt/sắp xếp thoải mái.", single:false}
};
const cfgOK = window.SB_URL && window.SB_ANON && !SB_URL.includes("YOUR-") && !SB_ANON.includes("YOUR-");
let sb=null, rows=[], pending=null; // pending = hành động upload đang chờ chọn file

const $=(s,r=document)=>r.querySelector(s);
const busy=v=>$("#busy").classList.toggle("show",v);
function toast(t,kind=""){const el=$("#toast");el.textContent=t;el.className="toast show "+kind;clearTimeout(el._t);el._t=setTimeout(()=>el.className="toast",2600);}
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ============ CẤU HÌNH CHƯA ĐIỀN ============ */
if(!cfgOK){
  $("#cfgBox").innerHTML='<div class="cfgwarn">Chưa cấu hình Supabase. Mở file <code>config.js</code> và điền <code>SB_URL</code> + <code>SB_ANON</code> (lấy ở Supabase → Project Settings → API), rồi tải lại trang.</div>';
  $("#loginForm").style.display="none";
}else{
  sb = supabase.createClient(window.SB_URL, window.SB_ANON, {auth:{persistSession:true,autoRefreshToken:true}});
  boot();
}

/* ============ ĐĂNG NHẬP ============ */
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(session){ showApp(session); }
  sb.auth.onAuthStateChange((_e,s)=>{ if(s) showApp(s); else showLogin(); });
}
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const email=$("#email").value.trim(), password=$("#pass").value;
  $("#loginMsg").className="msg"; $("#loginMsg").textContent="Đang đăng nhập…";
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error){ $("#loginMsg").className="msg err"; $("#loginMsg").textContent="Sai email hoặc mật khẩu. "+error.message; }
});
$("#logout").addEventListener("click", async ()=>{ await sb.auth.signOut(); });
function showLogin(){ $("#loginView").style.display="block"; $("#appView").style.display="none"; }
async function showApp(session){
  $("#loginView").style.display="none"; $("#appView").style.display="block";
  $("#whoami").textContent="Đã đăng nhập: "+(session.user?.email||"admin")+" · đồng bộ realtime";
  await loadRows(); subscribe();
}

/* ============ DỮ LIỆU ============ */
async function loadRows(){
  busy(true);
  const {data,error}=await sb.from("sotay_images").select("*").order("slot").order("display_order").order("id");
  busy(false);
  if(error){ toast("Lỗi tải dữ liệu: "+error.message,"err"); return; }
  rows=data||[]; render();
}
let ch=null;
function subscribe(){
  if(ch) return;
  ch=sb.channel("sotay-admin").on("postgres_changes",{event:"*",schema:"public",table:"sotay_images"},()=>loadRows()).subscribe();
}
const bySlot=slot=>rows.filter(r=>r.slot===slot).sort((a,b)=>(a.display_order-b.display_order)||(a.id-b.id));

/* ============ HIỂN THỊ ============ */
function render(){
  const C=$("#sections"); C.innerHTML="";
  for(const [slot,meta] of Object.entries(SLOTS)){
    const items=bySlot(slot);
    const sec=document.createElement("div"); sec.className="sec";
    sec.innerHTML=`<div class="sec-h">
        <div class="ic ${meta.ic}">${meta.emoji}</div>
        <h3>${meta.name}</h3>
        <span class="cnt">${items.length} ảnh</span>
      </div><p class="sec-desc">${meta.desc}</p>`;
    if(meta.single){ sec.appendChild(singleView(slot,items[0])); }
    else{ sec.appendChild(galleryView(slot,items)); }
    C.appendChild(sec);
  }
}
function singleView(slot,item){
  const d=document.createElement("div"); d.className="slot";
  if(item){
    d.innerHTML=`<img class="thumb" src="${esc(item.image_url)}" alt="">
      <div class="body">
        <input class="t" value="${esc(item.title)}" data-id="${item.id}" placeholder="Tiêu đề / chú thích">
        <div class="acts">
          <button class="btn btn-sm btn-blue" data-act="replace" data-id="${item.id}" data-slot="${slot}">Thay ảnh</button>
          <button class="btn btn-sm btn-gold" data-act="savetitle" data-id="${item.id}">Lưu tiêu đề</button>
          <button class="btn btn-sm ${item.active?'mini':'btn-gold'}" data-act="toggle" data-id="${item.id}">${item.active?'Đang hiện — tắt':'Đang ẩn — bật'}</button>
        </div>
      </div>`;
  }else{
    d.innerHTML=`<div class="thumb" style="display:grid;place-items:center;color:#8aa;font-size:12px">chưa có ảnh</div>
      <div class="body"><div class="acts">
        <button class="btn btn-sm btn-blue" data-act="add" data-slot="${slot}">Tải ảnh lên</button>
      </div></div>`;
  }
  d.querySelectorAll("[data-act]").forEach(bindAct);
  return d;
}
function galleryView(slot,items){
  const g=document.createElement("div"); g.className="grid";
  items.forEach((it,idx)=>{
    const c=document.createElement("div"); c.className="card"+(it.active?"":" hidden");
    c.innerHTML=`<div class="imgwrap"><span class="ord">${idx+1}</span><span class="off">Đang ẩn</span><img src="${esc(it.image_url)}" alt=""></div>
      <div class="pad">
        <textarea data-id="${it.id}" placeholder="Chú thích ảnh…">${esc(it.title)}</textarea>
        <div class="row">
          <button class="btn btn-sm mini" data-act="up" data-id="${it.id}" title="Lên trước">▲</button>
          <button class="btn btn-sm mini" data-act="down" data-id="${it.id}" title="Xuống sau">▼</button>
          <button class="btn btn-sm btn-gold" data-act="savetitle" data-id="${it.id}">Lưu</button>
        </div>
        <div class="row">
          <button class="btn btn-sm btn-blue" data-act="replace" data-id="${it.id}" data-slot="${slot}">Thay ảnh</button>
          <button class="btn btn-sm ${it.active?'mini':'btn-gold'}" data-act="toggle" data-id="${it.id}">${it.active?'Ẩn':'Hiện'}</button>
          <button class="btn btn-sm btn-red" data-act="del" data-id="${it.id}">Xóa</button>
        </div>
      </div>`;
    c.querySelectorAll("[data-act]").forEach(bindAct);
    g.appendChild(c);
  });
  const add=document.createElement("div"); add.className="addcard"; add.dataset.act="add"; add.dataset.slot=slot;
  add.innerHTML=`<div class="plus">＋</div>Thêm ảnh vào thư viện`;
  bindAct(add); g.appendChild(add);
  return g;
}

/* ============ HÀNH ĐỘNG ============ */
function bindAct(el){
  el.addEventListener("click",()=>{
    const act=el.dataset.act, id=+el.dataset.id, slot=el.dataset.slot;
    if(act==="add"){ pending={mode:"add",slot}; $("#filePick").click(); }
    else if(act==="replace"){ pending={mode:"replace",id,slot}; $("#filePick").click(); }
    else if(act==="savetitle"){ saveTitle(id); }
    else if(act==="toggle"){ toggle(id); }
    else if(act==="del"){ delItem(id); }
    else if(act==="up"){ move(id,-1); }
    else if(act==="down"){ move(id,1); }
  });
}
function titleOf(id){ const e=document.querySelector(`[data-id="${id}"]`); return e?e.value:""; }
async function saveTitle(id){
  busy(true);
  const {error}=await sb.from("sotay_images").update({title:titleOf(id)}).eq("id",id);
  busy(false); error?toast("Lỗi: "+error.message,"err"):toast("Đã lưu tiêu đề ✓","ok");
}
async function toggle(id){
  const r=rows.find(x=>x.id===id); if(!r)return; busy(true);
  const {error}=await sb.from("sotay_images").update({active:!r.active}).eq("id",id);
  busy(false); error?toast("Lỗi: "+error.message,"err"):toast(r.active?"Đã ẩn ảnh":"Đã bật hiện ảnh","ok");
}
async function delItem(id){
  const r=rows.find(x=>x.id===id); if(!r)return;
  if(!confirm("Xóa ảnh này khỏi Sổ tay? (không thể hoàn tác)"))return;
  busy(true);
  if(r.storage_path){ await sb.storage.from("sotay").remove([r.storage_path]); }
  const {error}=await sb.from("sotay_images").delete().eq("id",id);
  busy(false); error?toast("Lỗi: "+error.message,"err"):toast("Đã xóa ảnh","ok");
}
async function move(id,dir){
  const r=rows.find(x=>x.id===id); if(!r)return;
  const list=bySlot(r.slot); const i=list.findIndex(x=>x.id===id); const j=i+dir;
  if(j<0||j>=list.length)return;
  const a=list[i], b=list[j]; busy(true);
  await sb.from("sotay_images").update({display_order:b.display_order}).eq("id",a.id);
  await sb.from("sotay_images").update({display_order:a.display_order}).eq("id",b.id);
  busy(false); toast("Đã đổi thứ tự");
}

/* ============ UPLOAD ============ */
$("#filePick").addEventListener("change", async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file||!pending)return;
  const {mode,slot,id}=pending; pending=null;
  busy(true);
  try{
    const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
    const path=`${slot}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
    const up=await sb.storage.from("sotay").upload(path,file,{upsert:true,contentType:file.type||"image/jpeg"});
    if(up.error) throw up.error;
    const {data:{publicUrl}}=sb.storage.from("sotay").getPublicUrl(path);
    if(mode==="replace"){
      const r=rows.find(x=>x.id===id);
      if(r&&r.storage_path) await sb.storage.from("sotay").remove([r.storage_path]);
      const {error}=await sb.from("sotay_images").update({image_url:publicUrl,storage_path:path}).eq("id",id);
      if(error)throw error; toast("Đã thay ảnh ✓","ok");
    }else{
      const list=bySlot(slot); const ord=list.length?Math.max(...list.map(x=>x.display_order))+1:1;
      const {error}=await sb.from("sotay_images").insert({slot,title:"",image_url:publicUrl,storage_path:path,display_order:ord,active:true});
      if(error)throw error; toast("Đã thêm ảnh ✓","ok");
    }
  }catch(err){ toast("Lỗi upload: "+(err.message||err),"err"); }
  busy(false);
});
</script>
</body>
